<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書管理システム - 棚卸対応</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        #interactive { height: 240px; background: #000; border-radius: 12px; overflow: hidden; position: relative; }
        #interactive video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; inset: 0; pointer-events: none; background: rgba(0,0,0,0.2); }
        .scan-box { position: absolute; inset: 20% 10%; border: 2px solid rgba(255,0,0,0.6); box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); }
        .scan-line { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; background: red; box-shadow: 0 0 8px red; animation: scanAnim 2s infinite; }
        @keyframes scanAnim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #1e293b; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

<header class="bg-white shadow sticky top-0 z-10">
    <div class="px-4 py-3 flex justify-between items-center border-b border-slate-100">
        <h1 class="font-bold text-xl flex items-center gap-2">
            <span class="material-icons-round text-slate-700">library_books</span>
            <span>蔵書管理</span>
        </h1>
        <div class="flex gap-2">
            <button id="toggleShelfBtn" onclick="toggleShelfMode()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition">
                <span class="material-icons-round text-sm">fact_check</span>
                <span class="hidden sm:inline">棚卸開始</span>
            </button>
            <button onclick="openModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 shadow transition">
                <span class="material-icons-round text-sm">add</span> 登録
            </button>
        </div>
    </div>
    
    <div class="px-4 py-3 bg-slate-50 flex gap-2 overflow-x-auto">
        <div class="flex-1 relative">
            <span class="material-icons-round absolute left-2 top-2.5 text-slate-400 text-sm">search</span>
            <input id="searchTitle" placeholder="タイトル・著者名で検索" class="w-full pl-8 pr-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>
        <div class="w-1/3 min-w-[120px] relative">
            <span class="material-icons-round absolute left-2 top-2.5 text-slate-400 text-sm">tag</span>
            <input id="searchMc" placeholder="管理番号" class="w-full pl-8 pr-2 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400" inputmode="numeric">
        </div>
    </div>
</header>

<main class="p-4 max-w-6xl mx-auto">
    <div id="loadingMsg" class="text-center text-slate-400 mt-10">
        <div class="loader mb-2"></div><br>データを読み込み中...
    </div>
    <div id="bookGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    <div id="noResultMsg" class="hidden text-center text-slate-400 mt-10">
        書籍が見つかりませんでした
    </div>
</main>

<!-- 登録/編集/棚卸モーダル -->
<div id="modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50 backdrop-blur-sm transition-opacity">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center mb-4">
            <h2 id="modalTitle" class="font-bold text-lg text-slate-700">書籍登録 / 編集</h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><span class="material-icons-round">close</span></button>
        </div>

        <div id="scannerSection" class="hidden mb-4 relative">
            <div id="interactive">
                <div class="scan-overlay"></div>
                <div class="scan-box"></div>
                <div class="scan-line"></div>
            </div>
            <p class="text-[10px] text-center mt-2 text-slate-500">バーコードを枠内に合わせ、赤い線が横切るようにしてください</p>
            <button onclick="stopScanner()" class="w-full text-red-500 mt-2 text-sm font-bold py-1">スキャンを中止</button>
        </div>

        <div id="formFields">
            <button id="btnScan" onclick="startScanner()" class="w-full border border-slate-300 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg p-3 mb-4 flex justify-center items-center gap-2 transition">
                <span class="material-icons-round">qr_code_scanner</span> バーコードスキャン
            </button>

            <div class="space-y-3">
                <div class="flex gap-2">
                    <input id="inpIsbn" placeholder="ISBN (13桁)" class="flex-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-slate-500 outline-none" inputmode="numeric">
                    <button id="btnLookup" onclick="lookupISBN()" class="bg-slate-200 hover:bg-slate-300 px-3 rounded-lg text-sm font-bold transition">取得</button>
                </div>
                <input id="inpMcNumber" placeholder="管理番号 (数字10桁)" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none" inputmode="numeric" maxlength="10">
                <input id="inpTitle" placeholder="タイトル" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                <input id="inpAuthor" placeholder="著者名" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                <input type="hidden" id="inpCover">
                <div id="coverPreview" class="h-32 bg-slate-50 border-2 border-dashed border-slate-200 rounded-lg flex items-center justify-center text-slate-400 overflow-hidden">
                    <span class="text-sm">No Image</span>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="closeModal()" class="flex-1 border border-slate-300 text-slate-600 p-2.5 rounded-lg font-bold">閉じる</button>
                <button id="btnSave" onclick="saveBook()" class="flex-1 bg-slate-800 text-white p-2.5 rounded-lg font-bold shadow-lg">保存</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, where, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

/* 以前のFirebase設定に戻す */
const firebaseConfig = {
    apiKey: "AIzaSyChSeXTRYpykQkMmcDj041nlq-Nkt03oC4",
    authDomain: "library-management-tool-31dcd.firebaseapp.com",
    projectId: "library-management-tool-31dcd"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 状態
let allBooks = [];
let editingId = null;
let isScanning = false;
let shelfMode = false;
let lastCode = "";
let lastTime = 0;

// UI Elements
const el = {
    grid: document.getElementById("bookGrid"),
    modal: document.getElementById("modal"),
    loadingMsg: document.getElementById("loadingMsg"),
    noResultMsg: document.getElementById("noResultMsg"),
    searchTitle: document.getElementById("searchTitle"),
    searchMc: document.getElementById("searchMc"),
    isbn: document.getElementById("inpIsbn"),
    mc: document.getElementById("inpMcNumber"),
    title: document.getElementById("inpTitle"),
    author: document.getElementById("inpAuthor"),
    cover: document.getElementById("inpCover"),
    preview: document.getElementById("coverPreview"),
    modalTitle: document.getElementById("modalTitle"),
    formFields: document.getElementById("formFields"),
    scannerSection: document.getElementById("scannerSection"),
    btnSave: document.getElementById("btnSave"),
    btnLookup: document.getElementById("btnLookup"),
    toggleShelfBtn: document.getElementById("toggleShelfBtn")
};

// --- Firestore Sync (以前のルートコレクション "books" を使用) ---
onSnapshot(query(collection(db, "books"), orderBy("updatedAt", "desc")), (snap) => {
    allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    el.loadingMsg.classList.add("hidden");
    applySearch();
}, (err) => {
    console.error(err);
    el.loadingMsg.innerHTML = '<span class="text-red-500">読み込みエラーが発生しました</span>';
});

function applySearch() {
    const termT = el.searchTitle.value.toLowerCase();
    const termM = el.searchMc.value;
    const filtered = allBooks.filter(b => {
        const matchT = !termT || (b.title||"").toLowerCase().includes(termT) || (b.author||"").toLowerCase().includes(termT);
        const matchM = !termM || (b.mcNumber||"").includes(termM);
        return matchT && matchM;
    });
    render(filtered);
}

el.searchTitle.oninput = applySearch;
el.searchMc.oninput = applySearch;

function render(list) {
    el.grid.innerHTML = "";
    el.noResultMsg.classList.toggle("hidden", list.length > 0 || allBooks.length === 0);
    
    if (allBooks.length === 0) {
        el.grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">データがありません。「登録」から追加してください。</div>';
        return;
    }

    list.forEach(b => {
        const checkedDate = b.lastChecked ? (b.lastChecked.toDate ? b.lastChecked.toDate() : new Date(b.lastChecked.seconds * 1000)) : null;
        const checkedStr = checkedDate ? checkedDate.toLocaleDateString() : null;
        const checkedTag = checkedStr ? `<div class="mt-2 bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded-full inline-flex items-center gap-1 font-bold"><span class="material-icons-round text-[12px]">done</span>棚卸済: ${checkedStr}</div>` : "";
        
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition";
        card.innerHTML = `
            <div class="h-40 bg-slate-50 flex items-center justify-center p-2 relative overflow-hidden border-b border-slate-50">
                ${b.cover ? `<img src="${b.cover}" class="h-full w-full object-contain">` : `<span class="material-icons-round text-4xl text-slate-200">book</span>`}
            </div>
            <div class="p-3 flex-1 flex flex-col">
                <h3 class="font-bold text-xs line-clamp-2 h-8 leading-tight mb-1">${b.title || "無題"}</h3>
                <p class="text-[10px] text-slate-400 truncate">${b.author || "著者不明"}</p>
                <div class="mt-1 text-[10px] font-mono text-slate-500">No.${b.mcNumber || "-"}</div>
                ${checkedTag}
                <div class="mt-auto pt-3 flex gap-2">
                    <button onclick="editBook('${b.id}')" class="flex-1 text-[10px] py-1 border rounded hover:bg-slate-50 font-bold">編集</button>
                    <button onclick="deleteBook('${b.id}')" class="flex-1 text-[10px] py-1 border border-red-50 text-red-400 rounded hover:bg-red-50 font-bold">削除</button>
                </div>
            </div>
        `;
        el.grid.appendChild(card);
    });
}

// --- Actions ---
window.openModal = () => {
    editingId = null;
    shelfMode = false;
    el.modalTitle.innerText = "書籍登録";
    el.isbn.value = ""; el.mc.value = ""; el.title.value = ""; el.author.value = ""; el.cover.value = "";
    el.preview.innerHTML = '<span class="text-sm">No Image</span>';
    el.formFields.classList.remove("hidden");
    el.scannerSection.classList.add("hidden");
    el.modal.classList.replace("hidden", "flex");
};

window.closeModal = () => {
    stopScanner();
    el.modal.classList.replace("flex", "hidden");
};

window.editBook = (id) => {
    const b = allBooks.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    shelfMode = false;
    el.modalTitle.innerText = "書籍編集";
    el.isbn.value = b.isbn || "";
    el.mc.value = b.mcNumber || "";
    el.title.value = b.title || "";
    el.author.value = b.author || "";
    el.cover.value = b.cover || "";
    el.preview.innerHTML = b.cover ? `<img src="${b.cover}" class="h-full w-full object-contain">` : '<span class="text-sm">No Image</span>';
    el.formFields.classList.remove("hidden");
    el.scannerSection.classList.add("hidden");
    el.modal.classList.replace("hidden", "flex");
};

window.deleteBook = async (id) => {
    if (confirm("この本を削除しますか？")) {
        await deleteDoc(doc(db, "books", id));
    }
};

window.saveBook = async () => {
    const mcValue = el.mc.value.trim();
    const titleValue = el.title.value.trim();
    if (!/^\d{10}$/.test(mcValue)) return alert("管理番号は数字10桁で入力してください");
    if (!titleValue) return alert("タイトルを入力してください");

    // 重複チェック
    const q = query(collection(db, "books"), where("mcNumber", "==", mcValue));
    const snap = await getDocs(q);
    const isDuplicate = snap.docs.some(d => d.id !== editingId);
    if (isDuplicate) return alert("この管理番号はすでに登録されています");

    const data = {
        isbn: el.isbn.value.trim(),
        mcNumber: mcValue,
        title: titleValue,
        author: el.author.value.trim(),
        cover: el.cover.value,
        updatedAt: new Date()
    };

    try {
        if (editingId) {
            await updateDoc(doc(db, "books", editingId), data);
        } else {
            data.createdAt = new Date();
            await addDoc(collection(db, "books"), data);
        }
        closeModal();
    } catch(e) {
        alert("保存に失敗しました: " + e.message);
    }
};

// --- 棚卸モード ---
window.toggleShelfMode = () => {
    shelfMode = !shelfMode;
    if (shelfMode) {
        el.modalTitle.innerText = "棚卸スキャン";
        el.formFields.classList.add("hidden");
        el.modal.classList.replace("hidden", "flex");
        startScanner();
    } else {
        closeModal();
    }
};

// --- スキャナーロジック ---
window.startScanner = () => {
    el.scannerSection.classList.remove("hidden");
    if (!shelfMode) el.formFields.classList.add("opacity-30", "pointer-events-none");

    Quagga.init({
        inputStream: { name: "Live", type: "LiveStream", target: document.querySelector("#interactive"), constraints: { facingMode: "environment" } },
        decoder: { readers: ["ean_reader"] },
        locate: true
    }, (err) => {
        if (err) return alert("カメラを起動できませんでした");
        Quagga.start();
        isScanning = true;
    });

    Quagga.onDetected(async (res) => {
        const code = res.codeResult.code;
        const now = Date.now();
        if (!/^97[89]\d{10}$/.test(code)) return;
        if (code === lastCode && now - lastTime < 3000) return;
        
        lastCode = code;
        lastTime = now;

        if (shelfMode) {
            const book = allBooks.find(b => b.isbn === code);
            if (book) {
                await updateDoc(doc(db, "books", book.id), {
                    lastChecked: new Date(),
                    updatedAt: new Date()
                });
                showToast(`棚卸確認: ${book.title}`);
            } else {
                showToast("未登録の書籍です", true);
            }
        } else {
            el.isbn.value = code;
            stopScanner();
            lookupISBN();
        }
    });
};

window.stopScanner = () => {
    if (isScanning) {
        Quagga.stop();
        Quagga.offDetected();
        isScanning = false;
    }
    el.scannerSection.classList.add("hidden");
    el.formFields.classList.remove("opacity-30", "pointer-events-none");
    if (shelfMode) shelfMode = false;
};

// --- ISBN 検索 ---
window.lookupISBN = async () => {
    const code = el.isbn.value.replace(/\D/g, "");
    if (code.length !== 13) return alert("ISBNは13桁で入力してください");
    
    el.preview.innerHTML = '<div class="loader"></div>';
    try {
        const res = await fetch(`https://api.openbd.jp/v1/get?isbn=${code}`);
        const data = await res.json();
        if (data && data[0]?.summary) {
            const s = data[0].summary;
            el.title.value = s.title || "";
            el.author.value = s.author || "";
            el.cover.value = s.cover || "";
            updateCoverPreview(s.cover);
        } else {
            // Google Books API フォールバック
            const gRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${code}`);
            const gData = await gRes.json();
            if (gData.items?.[0]?.volumeInfo) {
                const info = gData.items[0].volumeInfo;
                el.title.value = info.title || "";
                el.author.value = info.authors?.join(", ") || "";
                const img = info.imageLinks?.thumbnail?.replace("http://", "https://") || "";
                el.cover.value = img;
                updateCoverPreview(img);
            } else {
                el.preview.innerHTML = '<span class="text-xs">情報が見つかりませんでした</span>';
            }
        }
    } catch (e) { 
        el.preview.innerHTML = "Error"; 
    }
};

function updateCoverPreview(url) {
    el.preview.innerHTML = url ? `<img src="${url}" class="h-full w-full object-contain">` : '<span class="text-sm">No Image</span>';
}

function showToast(msg, isError = false) {
    const t = document.createElement("div");
    t.className = `fixed bottom-10 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold shadow-2xl z-[100] transition-all transform translate-y-20 ${isError ? 'bg-red-500' : 'bg-green-600'}`;
    t.innerText = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.remove("translate-y-20"), 10);
    setTimeout(() => {
        t.classList.add("translate-y-20", "opacity-0");
        setTimeout(() => t.remove(), 500);
    }, 2500);
}
</script>
</body>
</html>
