<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蔵書管理システム</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans JP', sans-serif; }
        #interactive { 
            height: 240px; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            position: relative; 
            width: 100%;
        }
        #interactive video, #interactive canvas { 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover; 
        }
        .scan-overlay { position: absolute; inset: 0; pointer-events: none; background: rgba(0,0,0,0.2); z-index: 10; }
        .scan-box { position: absolute; inset: 20% 10%; border: 2px solid rgba(255,0,0,0.6); box-shadow: 0 0 0 2000px rgba(0,0,0,0.4); z-index: 11; }
        .scan-line { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; background: red; box-shadow: 0 0 8px red; animation: scanAnim 2s infinite; z-index: 12; }
        @keyframes scanAnim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #1e293b; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800">

<header class="bg-white shadow sticky top-0 z-20">
    <div class="px-4 py-3 flex justify-between items-center border-b border-slate-100">
        <h1 class="font-bold text-xl flex items-center gap-2 text-slate-800">
            <span class="material-icons-round text-slate-700">library_books</span>
            <span class="hidden xs:inline">蔵書管理</span>

        </h1>
        <div class="flex gap-2">
            <button id="toggleShelfBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition border border-slate-200">
                <span class="material-icons-round text-sm">fact_check</span>
                <span class="hidden sm:inline">棚卸モード</span>
                <span class="inline sm:hidden">棚卸</span>
            </button>
            <button id="btnOpenModal" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-1 shadow-md hover:shadow-lg transition transform active:scale-95">
                <span class="material-icons-round text-sm">add</span> 登録

<main class="p-4 max-w-7xl mx-auto pb-20">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyChSeXTRYpykQkMmcDj041nlq-Nkt03oC4",
    authDomain: "library-management-tool-31dcd.firebaseapp.com",
    projectId: "library-management-tool-31dcd"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const COLLECTION_NAME = "books";

let allBooks = [];
let editingId = null;
let isScanning = false;
let shelfMode = false;
let lastCode = "";
let lastTime = 0;

const el = {
    grid: document.getElementById("bookGrid"),
    modal: document.getElementById("modal"),
    loadingMsg: document.getElementById("loadingMsg"),
    emptyState: document.getElementById("emptyState"),
    noResultMsg: document.getElementById("noResultMsg"),
    searchTitle: document.getElementById("searchTitle"),
    searchMc: document.getElementById("searchMc"),
    isbn: document.getElementById("inpIsbn"),
    mc: document.getElementById("inpMcNumber"),
    title: document.getElementById("inpTitle"),
    author: document.getElementById("inpAuthor"),
    cover: document.getElementById("inpCover"),
    preview: document.getElementById("coverPreview"),
    modalTitle: document.getElementById("modalTitle"),
    formFields: document.getElementById("formFields"),
    scannerSection: document.getElementById("scannerSection"),
    btnSave: document.getElementById("btnSave"),
    btnLookup: document.getElementById("btnLookup"),
    lookupText: document.getElementById("lookupText"),
    lookupLoader: document.getElementById("lookupLoader"),
    toggleShelfBtn: document.getElementById("toggleShelfBtn"),
    btnOpenModal: document.getElementById("btnOpenModal"),
    btnEmptyAdd: document.getElementById("btnEmptyAdd"),
    btnCloseModal: document.getElementById("btnCloseModal"),
    btnCancel: document.getElementById("btnCancel"),
    btnScan: document.getElementById("btnScan"),
    btnStopScan: document.getElementById("btnStopScan")
};

// Event Listeners
el.toggleShelfBtn.onclick = toggleShelfMode;
el.btnOpenModal.onclick = openModal;
el.btnEmptyAdd.onclick = openModal;
el.btnCloseModal.onclick = closeModal;
el.btnCancel.onclick = closeModal;
el.btnSave.onclick = saveBook;
el.btnLookup.onclick = lookupISBN;
el.btnScan.onclick = startScanner;
el.btnStopScan.onclick = stopScanner;
el.searchTitle.oninput = applySearch;
el.searchMc.oninput = applySearch;

function init() {
    const q = query(collection(db, COLLECTION_NAME), orderBy("updatedAt", "desc"));
    onSnapshot(q, (snap) => {
        allBooks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        el.loadingMsg.classList.add("hidden");
        applySearch();
    }, (err) => {
        console.error("Firestore Error:", err);
        el.loadingMsg.innerHTML = "";
        el.loadingMsg.textContent = "データ読み込みエラー: " + err.message;
        el.loadingMsg.classList.add("text-red-500");
    });
}
init();

function applySearch() {
    const termT = el.searchTitle.value.toLowerCase();
    const termM = el.searchMc.value;
    
    const filtered = allBooks.filter(b => {
        const titleStr = (b.title || "").toLowerCase();
        const authorStr = (b.author || "").toLowerCase();
        const mcStr = (b.mcNumber || "");
        
        const matchT = !termT || titleStr.includes(termT) || authorStr.includes(termT);
        const matchM = !termM || mcStr.includes(termM);
        return matchT && matchM;
    });
    
    render(filtered);
}

function render(list) {
    el.grid.innerHTML = "";
    
    const hasData = allBooks.length > 0;
    const hasResults = list.length > 0;

    el.emptyState.classList.toggle("hidden", hasData);
    el.noResultMsg.classList.toggle("hidden", !hasData || hasResults);
    
    if (!hasResults) return;

    list.forEach(b => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition group h-full relative";
        
        // Delete Button
        const delBtn = document.createElement("button");
        delBtn.className = "absolute top-2 right-2 bg-white/90 text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded-full shadow-sm border border-slate-100 transition z-20";
        delBtn.title = "削除";
        delBtn.innerHTML = '<span class="material-icons-round text-lg block">delete</span>';
        delBtn.onclick = (e) => {
            e.stopPropagation();
            deleteBook(b.id);
        };
        card.appendChild(delBtn);

        // Image Section
        const imgDiv = document.createElement("div");
        imgDiv.className = "aspect-[2/3] w-full bg-slate-50 flex items-center justify-center relative overflow-hidden border-b border-slate-50 cursor-pointer";
        imgDiv.onclick = () => editBook(b.id);

        if (b.cover) {
            const img = document.createElement("img");
            img.src = b.cover;
            img.className = "h-full w-full object-cover transition-transform duration-500 group-hover:scale-105";
            img.loading = "lazy";
            img.referrerPolicy = "no-referrer";
            img.onerror = function() { 
                if(this.parentElement) {
                    this.parentElement.innerHTML = '<span class="material-icons-round text-4xl text-slate-200">auto_stories</span>';
                }
            };
            imgDiv.appendChild(img);
        } else {
            const icon = document.createElement("span");
            icon.className = "material-icons-round text-4xl text-slate-200";
            icon.textContent = "auto_stories";
            imgDiv.appendChild(icon);
        }

        if (b.mcNumber) {
            const mcBadge = document.createElement("div");
            mcBadge.className = "absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/60 to-transparent p-2 pt-6";
            
            const badgeText = document.createElement("div");
            badgeText.className = "text-[10px] text-white font-mono font-bold";
            badgeText.textContent = "No." + b.mcNumber;
            
            mcBadge.appendChild(badgeText);
            imgDiv.appendChild(mcBadge);
        }
        card.appendChild(imgDiv);

        // Info Section
        const infoDiv = document.createElement("div");
        infoDiv.className = "p-3 flex-1 flex flex-col cursor-pointer";
        infoDiv.onclick = () => editBook(b.id);

        const title = document.createElement("h3");
        title.className = "font-bold text-sm line-clamp-2 leading-tight mb-1 text-slate-700 group-hover:text-slate-900 transition";
        title.textContent = b.title || "無題";
        infoDiv.appendChild(title);

        const author = document.createElement("p");
        author.className = "text-xs text-slate-400 truncate mb-1";
        author.textContent = b.author || "著者不明";
        infoDiv.appendChild(author);

        if (b.lastChecked) {
            const checkedDate = b.lastChecked.toDate ? b.lastChecked.toDate() : new Date(b.lastChecked.seconds * 1000);
            const now = new Date();
            const isToday = checkedDate.toDateString() === now.toDateString();
            const dateStr = isToday ? ("今日 " + checkedDate.getHours() + ":" + String(checkedDate.getMinutes()).padStart(2, '0')) : checkedDate.toLocaleDateString();
            
            const checkTag = document.createElement("div");
            checkTag.className = "mt-2 bg-emerald-50 text-emerald-600 border border-emerald-100 text-[10px] px-2 py-1 rounded-md inline-flex items-center gap-1 font-bold w-full";
            checkTag.innerHTML = '<span class="material-icons-round text-[12px]">check_circle</span><span>棚卸済: ' + dateStr + '</span>';
            infoDiv.appendChild(checkTag);
        }

        card.appendChild(infoDiv);
        el.grid.appendChild(card);
    });
}

function toHttps(url) {
    if (!url) return "";
    let fixed = url.replace(/^http:\/\//i, 'https://');
    if (fixed.includes("books.google.com")) {
        try {
            const urlObj = new URL(fixed);
            urlObj.searchParams.delete('edge');
            fixed = urlObj.toString();
        } catch(e) {}
    }
    return fixed;
}

// 複数の画像候補を保持して、表示できるまで試すロジック
async function lookupISBN() {
    const code = el.isbn.value.replace(/\D/g, "");
    if (code.length !== 13 && code.length !== 10) return showToast("ISBNは10桁または13桁で入力してください", true);
    
    el.btnLookup.disabled = true;
    el.lookupText.classList.add("hidden");
    el.lookupLoader.classList.remove("hidden");
    el.preview.innerHTML = '<div class="loader border-slate-300 border-t-slate-500"></div>';

    try {
        let title = "", author = "";
        let candidates = []; // 画像URLの候補リスト
        
        // 1. OpenBD (高画質・国内向け)
        try {
            const openbdRes = await fetch("https://api.openbd.jp/v1/get?isbn=" + code).then(r => r.json());
            if (openbdRes && openbdRes[0] && openbdRes[0].summary) {
                const s = openbdRes[0].summary;
                title = s.title;
                author = s.author;
                if (s.cover) {
                     // OpenBDの画像があれば最優先候補
                     candidates.push(toHttps(s.cover));
                }
            }
        } catch(e) { console.warn("OpenBD fail", e); }

        // 2. Google Books (網羅性高い)
        try {
            const googleRes = await fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:" + code).then(r => r.json());
            
            if (googleRes.items && googleRes.items[0]) {
                const info = googleRes.items[0].volumeInfo;
                if (!title) {
                    title = info.title || "";
                    author = info.authors?.join(", ") || "";
                }
                
                // 画像候補を追加
                if (info.imageLinks) {
                    if (info.imageLinks.thumbnail) candidates.push(toHttps(info.imageLinks.thumbnail));
                    if (info.imageLinks.smallThumbnail) candidates.push(toHttps(info.imageLinks.smallThumbnail));
                }
                
                // IDからの強制生成URLも候補に追加 (フォールバックとして強力)
                if (googleRes.items[0].id) {
                    const fallbackUrl = "https://books.google.com/books/content?id=" + googleRes.items[0].id + "&printsec=frontcover&img=1&zoom=1&source=gbs_api";
                    candidates.push(fallbackUrl);
                }
            }
        } catch(e) { console.warn("Google Books fail", e); }

        // 3. Open Library (最後の砦)
        // MサイズとLサイズを候補に入れる
        candidates.push("https://covers.openlibrary.org/b/isbn/" + code + "-L.jpg?default=false");
        candidates.push("https://covers.openlibrary.org/b/isbn/" + code + "-M.jpg?default=false");

        if (title) {
            el.title.value = title;
            el.author.value = author;
            
            // 候補リストを渡して、表示できるものを探す
            tryLoadImage(candidates, 0);
            
            showToast("書籍情報が見つかりました");
        } else {
            throw new Error("NOT_FOUND");
        }
    } catch (e) {
        el.preview.innerHTML = '<span class="text-xs text-slate-400">見つかりませんでした</span>';
        showToast("書籍情報が見つかりませんでした", true);
    } finally {
        el.btnLookup.disabled = false;
        el.lookupText.classList.remove("hidden");
        el.lookupLoader.classList.add("hidden");
    }
}

// 再帰的に画像を試す関数
function tryLoadImage(candidates, index) {
    if (index >= candidates.length) {
        // 全滅した場合
        el.cover.value = ""; // DB保存用も空にする
        el.preview.innerHTML = '<div class="flex flex-col items-center justify-center p-4 text-center h-full"><span class="material-icons-round text-4xl text-slate-200">image_not_supported</span><span class="text-xs text-slate-400 mt-2">画像なし</span></div>';
        return;
    }

    const url = candidates[index];
    
    // 画像を仮読み込みしてチェック
    const img = new Image();
    img.src = url;
    img.referrerPolicy = "no-referrer";
    
    img.onload = function() {
        // 成功したら採用
        el.cover.value = url;
        
        // プレビュー表示
        el.preview.innerHTML = "";
        const displayImg = document.createElement("img");
        displayImg.src = url;
        displayImg.className = "h-full w-full object-contain";
        displayImg.referrerPolicy = "no-referrer";
        el.preview.appendChild(displayImg);
    };
    
    img.onerror = function() {
        // 失敗したら次を試す
        tryLoadImage(candidates, index + 1);
    };
}

// 手動編集やDB読み込み時のプレビュー用
function updateCoverPreview(url) {
    el.preview.innerHTML = "";
    if (url) {
        const img = document.createElement("img");
        img.src = url;
        img.className = "h-full w-full object-contain";
        img.referrerPolicy = "no-referrer";
        img.onerror = function() { 
            if(this.parentElement) {
                this.parentElement.innerHTML = '<span class="text-sm flex flex-col items-center gap-1"><span class="material-icons-round text-slate-300">image</span>No Image</span>';
            }
        };
        el.preview.appendChild(img);
    } else {
        el.preview.innerHTML = '<span class="text-sm flex flex-col items-center gap-1"><span class="material-icons-round text-slate-300">image</span>No Image</span>';
    }
}

function openModal() {
    editingId = null;
    shelfMode = false;
    el.modalTitle.innerHTML = '<span class="material-icons-round text-slate-500 mr-2">add_circle</span>書籍登録';
    el.isbn.value = ""; el.mc.value = ""; el.title.value = ""; el.author.value = ""; el.cover.value = "";
    updateCoverPreview("");
    
    el.formFields.classList.remove("hidden");
    el.scannerSection.classList.add("hidden");
    
    el.modal.classList.remove("hidden");
    requestAnimationFrame(() => {
        el.modal.classList.remove("opacity-0");
        el.modal.classList.add("flex");
    });
}

function closeModal() {
    stopScanner();
    el.modal.classList.add("opacity-0");
    setTimeout(() => {
        el.modal.classList.remove("flex");
        el.modal.classList.add("hidden");
    }, 200);
}

function editBook(id) {
    const b = allBooks.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    shelfMode = false;
    el.modalTitle.innerHTML = '<span class="material-icons-round text-slate-500 mr-2">edit</span>書籍編集';
    el.isbn.value = b.isbn || "";
    el.mc.value = b.mcNumber || "";
    el.title.value = b.title || "";
    el.author.value = b.author || "";
    el.cover.value = b.cover || "";
    updateCoverPreview(b.cover);
    
    el.formFields.classList.remove("hidden");
    el.scannerSection.classList.add("hidden");
    
    el.modal.classList.remove("hidden");
    requestAnimationFrame(() => {
        el.modal.classList.remove("opacity-0");
        el.modal.classList.add("flex");
    });
}

async function saveBook() {
    const mcValue = el.mc.value.trim();
    const titleValue = el.title.value.trim();
    
    if (!mcValue) return showToast("管理番号は必須です", true);
    if (!/^\d+$/.test(mcValue)) return showToast("管理番号は数字で入力してください", true);
    if (!titleValue) return showToast("タイトルは必須です", true);

    const isDuplicate = allBooks.some(b => b.mcNumber === mcValue && b.id !== editingId);
    if (isDuplicate) {
        return showToast("管理番号「" + mcValue + "」は既に使用されています", true);
    }

    el.btnSave.disabled = true;
    el.btnSave.textContent = "保存中...";

    const data = {
        isbn: el.isbn.value.trim(),
        mcNumber: mcValue,
        title: titleValue,
        author: el.author.value.trim(),
        cover: el.cover.value,
        updatedAt: new Date()
    };

    try {
        if (editingId) {
            await updateDoc(doc(db, COLLECTION_NAME, editingId), data);
            showToast("更新しました");
        } else {
            data.createdAt = new Date();
            await addDoc(collection(db, COLLECTION_NAME), data);
            showToast("登録しました");
        }
        closeModal();
    } catch(e) {
        console.error(e);
        showToast("保存に失敗しました: " + e.message, true);
    } finally {
        el.btnSave.disabled = false;
        el.btnSave.textContent = "保存する";
    }
}

async function deleteBook(id) {
    if (confirm("本当にこの書籍を削除しますか？")) {
        try {
            await deleteDoc(doc(db, COLLECTION_NAME, id));
            showToast("削除しました");
        } catch (e) {
            console.error(e);
            showToast("削除失敗: " + e.message, true);
        }
    }
}

function toggleShelfMode() {
    shelfMode = !shelfMode;
    
    if (shelfMode) {
        el.toggleShelfBtn.className = "bg-green-100 text-green-700 border-green-200 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition border";
        el.modalTitle.innerHTML = '<span class="material-icons-round text-green-500 mr-2">fact_check</span>棚卸スキャン中';
        el.formFields.classList.add("hidden");
        
        el.modal.classList.remove("hidden");
        requestAnimationFrame(() => {
            el.modal.classList.remove("opacity-0");
            el.modal.classList.add("flex");
        });
        startScanner();
    } else {
        el.toggleShelfBtn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition border border-slate-200";
        closeModal();
    }
}

function startScanner() {
    el.scannerSection.classList.remove("hidden");
    if (!shelfMode) el.formFields.classList.add("hidden");

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: document.querySelector("#interactive"),
                constraints: {
                    facingMode: "environment",
                    width: 640,
                    height: 480
                },
            },
            decoder: {
                readers: ["ean_reader"]
            },
            locate: true,
            locator: {
                patchSize: "medium",
                halfSample: true
            }
        }, (err) => {
            if (err) {
                console.error(err);
                el.scannerSection.innerHTML = '<div class="p-4 text-center text-red-500 bg-red-50 rounded-lg"><p class="font-bold">カメラを起動できませんでした</p><p class="text-xs mt-1">カメラの許可を確認してください。またはHTTPS接続が必要です。</p></div>';
                return;
            }
            Quagga.start();
            isScanning = true;
        });

        Quagga.onDetected(async (res) => {
            const code = res.codeResult.code;
            const now = Date.now();
            
            if (!/^97[89]\d{10}$/.test(code)) return;
            if (code === lastCode && now - lastTime < 2500) return;
            
            lastCode = code;
            lastTime = now;

            const box = document.querySelector(".scan-box");
            if(box) {
                box.style.borderColor = "#4ade80"; 
                box.style.boxShadow = "0 0 0 2000px rgba(0,0,0,0.7)";
                setTimeout(() => {
                    box.style.borderColor = "rgba(255,0,0,0.6)";
                    box.style.boxShadow = "0 0 0 2000px rgba(0,0,0,0.4)";
                }, 500);
            }

            if (shelfMode) {
                const book = allBooks.find(b => b.isbn === code);
                if (book) {
                    await updateDoc(doc(db, COLLECTION_NAME, book.id), {
                        lastChecked: new Date(),
                        updatedAt: new Date()
                    });
                    showToast("棚卸確認: " + (book.title || 'タイトルなし'));
                } else {
                    showToast("未登録: " + code, true);
                }
            } else {
                el.isbn.value = code;
                stopScanner();
                showToast("読み取り成功");
                lookupISBN();
            }
        });
    } else {
        alert("このデバイスではカメラがサポートされていません");
        stopScanner();
    }
}

function stopScanner() {
    if (isScanning) { 
        Quagga.stop(); 
        Quagga.offDetected(); 
        isScanning = false; 
    }
    el.scannerSection.classList.add("hidden");
    el.formFields.classList.remove("hidden");
    
    if (shelfMode) {
        shelfMode = false;
        el.toggleShelfBtn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg text-sm font-bold flex items-center gap-1 transition border border-slate-200";
    }
}

function showToast(msg, isError = false) {
    const existing = document.getElementById("toast-notif");
    if(existing) existing.remove();

    const t = document.createElement("div");
    t.id = "toast-notif";
    t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full text-white font-bold z-[100] shadow-xl flex items-center gap-2 transition-all transform translate-y-10 opacity-0 " + (isError ? 'bg-red-500' : 'bg-slate-800');
    t.innerHTML = '<span class="material-icons-round text-lg">' + (isError ? 'error_outline' : 'check_circle') + '</span><span>' + msg + '</span>';
    
    document.body.appendChild(t);
    
    requestAnimationFrame(() => {
        t.classList.remove("translate-y-10", "opacity-0");
    });
    
    setTimeout(() => {
        t.classList.add("translate-y-10", "opacity-0");
        setTimeout(() => t.remove(), 300);
    }, 3000);
}
</script>
