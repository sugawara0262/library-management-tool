<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Register</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase v8（module使わない） -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body class="bg-slate-100">

<!-- ＋登録 -->
<button onclick="openModal()"
  class="fixed bottom-6 right-6 bg-slate-700 text-white px-6 py-4 rounded-full shadow-lg z-40">
  ＋ 登録
</button>

<!-- モーダル -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 z-50">
  <div class="bg-white w-full h-full overflow-y-auto pb-40">

    <div class="p-4 space-y-4">
      <h2 class="text-xl font-bold">書籍登録</h2>

      <img id="cover" class="w-40 mx-auto hidden rounded shadow"/>

      <input id="isbn" placeholder="ISBN"
        class="w-full border p-3 rounded"/>

      <input id="title" placeholder="タイトル"
        class="w-full border p-3 rounded"/>

      <input id="author" placeholder="著者"
        class="w-full border p-3 rounded"/>

      <button onclick="fetchFromISBN()"
        class="w-full bg-slate-200 py-3 rounded">
        ISBNから取得
      </button>
    </div>
  </div>

  <!-- 固定フッター（iOS安全） -->
  <div class="fixed bottom-0 left-0 right-0 bg-white p-4 flex gap-3 z-50">
    <button onclick="closeModal()"
      class="flex-1 border py-3 rounded">
      キャンセル
    </button>
    <button onclick="registerBook()"
      class="flex-1 bg-slate-700 text-white font-bold py-3 rounded">
      登録
    </button>
  </div>
</div>

<script>
/* ===============================
   Firebase 初期化（要差し替え）
================================ */
var firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

/* ===============================
   モーダル制御
================================ */
window.openModal = function(){
  document.getElementById("modal").classList.remove("hidden");
}

window.closeModal = function(){
  document.getElementById("modal").classList.add("hidden");
}

/* ===============================
   ISBN → 情報取得
================================ */
window.fetchFromISBN = async function(){
  var isbn = document.getElementById("isbn").value.trim();
  if(!isbn){ alert("ISBNを入力してください"); return; }

  try{
    var res = await fetch(
      "https://www.googleapis.com/books/v1/volumes?q=isbn:" + isbn
    );
    var data = await res.json();
    var info = data.items && data.items[0] && data.items[0].volumeInfo;
    if(!info) throw "";

    document.getElementById("title").value = info.title || "";
    document.getElementById("author").value =
      (info.authors && info.authors.join(", ")) || "";

    if(info.imageLinks && info.imageLinks.thumbnail){
      var img = info.imageLinks.thumbnail.replace("http://","https://");
      var cover = document.getElementById("cover");
      cover.src = img;
      cover.classList.remove("hidden");
    }
  }catch{
    alert("書籍情報が取得できませんでした");
  }
}

/* ===============================
   Firestore 登録
================================ */
window.registerBook = async function(){
  var isbn = document.getElementById("isbn").value.trim();
  var title = document.getElementById("title").value.trim();
  var author = document.getElementById("author").value.trim();
  var cover = document.getElementById("cover").src || "";

  if(!title){
    alert("タイトルが未入力です");
    return;
  }

  try{
    await db.collection("books").add({
      isbn: isbn,
      title: title,
      author: author,
      cover: cover,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("登録しました");
    closeModal();

    // リセット
    document.getElementById("isbn").value = "";
    document.getElementById("title").value = "";
    document.getElementById("author").value = "";
    document.getElementById("cover").classList.add("hidden");

  }catch(e){
    alert("登録に失敗しました");
    console.error(e);
  }
}
</script>

</body>
</html>
